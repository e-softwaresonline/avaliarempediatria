<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogos de Avaliação Nutricional Pediátrica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Plano: papel de curva de crescimento (grade fina), tinta verde-petróleo, acento coral para ação; uma coluna central, cartões de tema em grade */
  --paper: #f3f7f6;
  --surface: #ffffff;
  --ink: #12302e;
  --muted: #557370;
  --grid: #dce7e4;
  --accent: #e0523a;
  --accent-ink: #ffffff;
  --good: #1f8a5b;
  --good-bg: #e2f4ea;
  --bad: #b8382f;
  --bad-bg: #fbe7e4;
  --sel: #fff1d6;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1c1b; --surface: #172826; --ink: #e4efec; --muted: #9db6b1; --grid: #1f3431;
    --accent: #f06a50; --accent-ink: #1a0d0a; --good: #4cc48c; --good-bg: #173a2b;
    --bad: #f07a6f; --bad-bg: #3d1f1c; --sel: #3b3220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1c1b; --surface: #172826; --ink: #e4efec; --muted: #9db6b1; --grid: #1f3431;
  --accent: #f06a50; --accent-ink: #1a0d0a; --good: #4cc48c; --good-bg: #173a2b;
  --bad: #f07a6f; --bad-bg: #3d1f1c; --sel: #3b3220; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 18px 60px; display: grid; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.12; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: -0.02em; }
h2 { font-size: clamp(22px, 3.4vw, 30px); font-weight: 700; }
h3 { font-size: 20px; font-weight: 700; }
p { margin: 0; max-width: 65ch; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--grid); border-radius: 14px; padding: 22px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700;
  background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--grid); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }

/* Início */
.start { display: grid; gap: 18px; padding: 34px 26px; }
.start .curve { width: 100%; max-width: 460px; height: auto; }
.field { display: grid; gap: 6px; max-width: 420px; }
.field label { font-weight: 700; }
.field input {
  padding: 13px 14px; border-radius: 10px; border: 1.5px solid var(--grid);
  background: var(--paper); font-size: 18px;
}
.err { color: var(--bad); font-size: 15px; min-height: 1.2em; }

/* Hub */
.topbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; }
.score-chip { font-family: var(--font-display); font-weight: 700; background: var(--surface); border: 1px solid var(--grid); border-radius: 999px; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.topic { display: grid; gap: 12px; align-content: start; }
.topic .num { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 15px; letter-spacing: .06em; }
.games { display: grid; gap: 8px; }
.gamebtn {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  text-align: left; padding: 11px 13px; border-radius: 10px;
  border: 1.5px solid var(--grid); background: var(--paper);
}
.gamebtn:hover { border-color: var(--accent); }
.gamebtn .kind { font-weight: 700; }
.gamebtn .best { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.gamebtn .best.done { color: var(--good); font-weight: 700; }

.topic.bonus { grid-column: 1 / -1; border: 2px solid var(--accent); background: linear-gradient(135deg, var(--sel), var(--surface) 60%); }
.topic.bonus .games:not([hidden]) { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.topic { padding: 0; overflow: hidden; }
.topic-toggle { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; padding: 18px 20px; }
.topic-toggle:hover h3 { color: var(--accent); }
.topic-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.chev { font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--accent); line-height: 1; width: 28px; text-align: center; }
.topic .games { padding: 0 20px 18px; }
.games[hidden] { display: none; }
.topic.open { border-color: var(--accent); }
.gicon svg, .tool svg { width: 20px; height: 20px; flex: none; }
.gamebtn .kind { display: flex; align-items: center; gap: 8px; }
.evalcard { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; border: 2px solid var(--ink); }
.eyebrow { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
.toolbar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--grid); border-radius: 14px; }
.tool-title { font-family: var(--font-display); font-weight: 700; flex: 1; min-width: 120px; }
.tool-group { display: flex; gap: 6px; flex-wrap: wrap; }
.tool { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--grid); background: var(--paper); font-weight: 700; font-size: 15px; }
.tool:hover { border-color: var(--accent); }
.tool.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tool.back { background: transparent; }
.letter { font-family: var(--font-display); font-weight: 800; color: var(--accent); margin-right: 4px; }
.opt.chosen { background: var(--sel); border-color: var(--accent); }
.answers { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; width: 100%; }
.ans { padding: 8px; border-radius: 8px; border: 1.5px solid var(--grid); background: var(--paper); font-variant-numeric: tabular-nums; }
.ans b { color: var(--muted); margin-right: 4px; }
.login .field { gap: 8px; }
.errcount { color: var(--bad); font-weight: 700; }
@media (max-width: 560px) { .tool span { display: none; } .tool { padding: 8px 10px; } }

/* Jogo */
.gamehead { display: grid; gap: 10px; }
.crumb { font-size: 14px; color: var(--muted); }
.progress { height: 8px; background: var(--grid); border-radius: 999px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.statline { display: flex; justify-content: space-between; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.question { font-size: 19px; font-weight: 700; max-width: 70ch; }
.case { background: var(--paper); border-left: 4px solid var(--accent); padding: 14px 16px; border-radius: 8px; max-width: 75ch; }
.options { display: grid; gap: 10px; }
.opt {
  text-align: left; padding: 13px 15px; border-radius: 10px;
  border: 1.5px solid var(--grid); background: var(--surface);
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.mv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 520px; }
.mv .opt { text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 22px; padding: 18px; }
.feedback { border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; max-width: 75ch; }
.feedback.ok { background: var(--good-bg); }
.feedback.no { background: var(--bad-bg); }
.feedback strong { font-family: var(--font-display); font-size: 18px; }

/* Associação */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.col { display: grid; gap: 8px; align-content: start; }
.col h3 { font-size: 15px; color: var(--muted); font-family: var(--font-body); text-transform: uppercase; letter-spacing: .05em; }
.tile {
  text-align: left; padding: 11px 12px; border-radius: 10px; font-size: 15.5px;
  border: 1.5px solid var(--grid); background: var(--surface); min-height: 48px;
}
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile.selected { background: var(--sel); border-color: var(--accent); }
.tile.matched { background: var(--good-bg); border-color: var(--good); cursor: default; }
.tile.shake { animation: shake .35s; border-color: var(--bad); background: var(--bad-bg); }
.tile .tag { font-family: var(--font-display); font-weight: 800; color: var(--good); margin-right: 6px; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* Resultado */
.result { display: grid; gap: 16px; justify-items: start; }
.big { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 9vw, 72px); line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: .4em; color: var(--muted); font-weight: 700; }

@media (max-width: 560px) {
  .match { gap: 8px; }
  .tile { font-size: 14px; padding: 9px; }
  .panel { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Cartões que viram */
.flip { perspective: 1200px; min-height: 236px; }
.flip.bonus { grid-column: 1 / -1; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 236px; transition: transform .6s cubic-bezier(.2,.7,.2,1); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; border: 1px solid var(--grid); background: var(--surface); padding: 18px 20px; }
.face.front { all: unset; box-sizing: border-box; position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; cursor: pointer; border-radius: 14px; border: 1px solid var(--grid);
  background: linear-gradient(160deg, var(--surface) 55%, var(--sel)); display: flex; flex-direction: column; justify-content: space-between; padding: 22px; }
.face.front h3 { font-size: 24px; }
.face.front:hover { border-color: var(--accent); }
.face.front:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.flip.bonus .face.front { border: 2px solid var(--accent); }
.front-meta { color: var(--muted); font-size: 14px; }
.face.back { transform: rotateY(180deg); display: grid; gap: 12px; align-content: start; border-color: var(--accent); }
.face.back h3 { font-size: 18px; }
.flip.bonus .face.back .games { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.corner { position: fixed; right: 16px; bottom: 16px; z-index: 20; border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 700;
  background: var(--ink); color: var(--paper); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.corner:hover { background: var(--accent); color: var(--accent-ink); }
.corner-msg { position: fixed; right: 16px; bottom: 66px; z-index: 20; max-width: 300px; font-size: 14px; background: var(--surface); border-radius: 10px; padding: 0 12px; }
.corner-msg:not(:empty) { padding: 8px 12px; border: 1px solid var(--grid); }
.wrap { padding-bottom: 90px; }
@media (prefers-reduced-motion: reduce) { .flip-inner { transition: none; } }

/* ---- Acabamento moderno ---- */
:root { --radius: 18px; --shadow: 0 1px 2px rgba(18,48,46,.06), 0 8px 24px rgba(18,48,46,.07); --shadow-lift: 0 2px 4px rgba(18,48,46,.08), 0 16px 36px rgba(18,48,46,.12); --tint: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
body { background-size: 32px 32px; }
.panel { border-radius: var(--radius); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--grid) 70%, transparent); }
.btn { border-radius: 999px; padding: 12px 22px; transition: transform .15s, box-shadow .15s, background .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.ghost:hover:not(:disabled) { box-shadow: none; border-color: var(--accent); }
.score-chip { box-shadow: var(--shadow); border-color: transparent; padding: 8px 16px; }
.topbar { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); }
.topics { gap: 18px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
.toolbar { border-radius: var(--radius); box-shadow: var(--shadow); border-color: transparent; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.tool { border-radius: 999px; }
.opt, .tile { border-radius: 14px; transition: border-color .15s, background .15s, transform .15s; }
.opt:hover:not(:disabled), .tile:hover:not(:disabled) { transform: translateY(-1px); }
.feedback { border-radius: 14px; }
.progress { height: 6px; }

/* Cartões: as duas faces ocupam a mesma célula, então a altura segue o conteúdo */
.flip { perspective: 1400px; min-height: 0; }
.flip-inner { display: grid; min-height: 0; height: auto; }
.flip .face, .flip .face.front { position: relative; inset: auto; grid-area: 1 / 1; border-radius: var(--radius); box-shadow: var(--shadow); min-height: 200px; }
.flip .face.front { padding: 20px 22px; gap: 14px; justify-content: space-between; border: 1px solid color-mix(in srgb, var(--grid) 70%, transparent);
  background: radial-gradient(120% 90% at 100% 0%, var(--tint), var(--surface) 60%); transition: transform .2s, box-shadow .2s; }
.flip:not(.flipped) .face.front:hover { box-shadow: var(--shadow-lift); }
.flip .face.front h3 { font-size: 22px; line-height: 1.15; }
.dots { display: flex; gap: 5px; }
.dots i { width: 22px; height: 5px; border-radius: 999px; background: var(--grid); }
.dots i.on { background: var(--good); }
.front-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.front-icons { display: flex; gap: 6px; }
.front-icons span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--paper); color: var(--muted); }
.front-icons svg { width: 16px; height: 16px; }
.front-meta { font-size: 14px; font-weight: 700; color: var(--accent); }
.front-meta b { display: inline-block; transition: transform .2s; }
.face.front:hover .front-meta b { transform: translateX(3px); }

.flip .face.back { padding: 14px; gap: 10px; align-content: start; border: 1.5px solid var(--accent); background: var(--surface); }
.back-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 4px 0 6px; }
.back-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.2; }
.iconbtn { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); }
.iconbtn:hover { background: var(--tint); color: var(--accent); }
.iconbtn svg { width: 18px; height: 18px; }
.flip .face.back .games { display: grid; gap: 6px; padding: 0; }
.flip.bonus .face.back .games { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.flip .gamebtn { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; border: 1px solid transparent; background: var(--paper); min-height: 0; transition: background .15s, border-color .15s, transform .15s; }
.flip .gamebtn:hover { background: var(--tint); border-color: color-mix(in srgb, var(--accent) 40%, transparent); transform: translateX(2px); }
.flip .gamebtn .gicon { display: grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--surface); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.flip .gamebtn .gicon svg { width: 18px; height: 18px; }
.gtext { display: grid; gap: 1px; flex: 1; min-width: 0; text-align: left; }
.gname { font-weight: 700; font-size: 15px; line-height: 1.2; }
.gsub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gsub.done { color: var(--good); font-weight: 700; }
.garrow { font-size: 22px; line-height: 1; color: var(--muted); }
.flip .gamebtn:hover .garrow { color: var(--accent); }
.flip.flipped .face.back { box-shadow: var(--shadow-lift); }
.corner { padding: 12px 20px; box-shadow: var(--shadow-lift); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.35); } }
:root[data-theme="dark"] { --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --shadow-lift: 0 2px 4px rgba(0,0,0,.35), 0 16px 36px rgba(0,0,0,.35); }
@media (prefers-reduced-motion: reduce) { .btn, .opt, .tile, .flip .gamebtn, .front-meta b { transition: none; } }
</style>

const app = document.getElementById("app");

function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function loadResults() {
  try { state.results = JSON.parse(storeGet("anp-results-" + state.name.toLowerCase()) || "{}") || {}; }
  catch (e) { state.results = {}; }
}
function saveResult(topic, game, score, total) {
  const key = topic + ":" + game;
  const prev = state.results[key];
  if (!prev || prev.total !== total || score > prev.score) state.results[key] = { score, total };
  storeSet("anp-results-" + state.name.toLowerCase(), JSON.stringify(state.results));
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// Mito ou verdade: sorteia a ordem sem deixar mais de 2 respostas iguais seguidas
function alternated(items) {
  let best = shuffle(items);
  for (let t = 0; t < 200; t++) {
    const cand = shuffle(items);
    let run = 1, ok = true;
    for (let i = 1; i < cand.length; i++) { run = cand[i][1] === cand[i - 1][1] ? run + 1 : 1; if (run > 2) { ok = false; break; } }
    if (ok) return cand;
    best = cand;
  }
  return best;
}
function totals() {
  let s = 0, t = 0, n = 0;
  Object.values(state.results).forEach(r => { s += r.score; t += r.total; n++; });
  return { s, t, n };
}

// ---------- Tempo e participação ----------
function histKey() { return "anp-hist-" + state.name.toLowerCase(); }
function loadHist() {
  try { state.hist = JSON.parse(storeGet(histKey()) || "null") || { sessoes: [], jogos: [] }; }
  catch (e) { state.hist = { sessoes: [], jogos: [] }; }
}
function saveHist() { storeSet(histKey(), JSON.stringify(state.hist)); }
function startSession() {
  loadHist();
  state.loginAt = Date.now();
  state.hist.sessoes.push({ inicio: state.loginAt, ultimo: state.loginAt });
  saveHist();
  clearInterval(state.tick);
  state.tick = setInterval(() => { touch(); const el = document.getElementById("clock"); if (el) el.textContent = fmtDur(Date.now() - state.loginAt); }, 1000);
}
function touch() {
  const s = state.hist && state.hist.sessoes[state.hist.sessoes.length - 1];
  if (!s) return;
  s.ultimo = Date.now();
  if (!state.lastSave || Date.now() - state.lastSave > 15000) { saveHist(); state.lastSave = Date.now(); }
}
function fmtDur(ms) {
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
  return (h ? h + " h " : "") + String(m).padStart(h ? 2 : 1, "0") + " min " + String(sec).padStart(2, "0") + " s";
}
function fmtData(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

// ---------- Resumo de participação (PDF) ----------
function pdfTxt(s) { return String(s).replace(/[–—−]/g, "-").replace(/[“”]/g, '"').replace(/★/g, "").replace(/[^\x20-\xFF]/g, ""); }
function resumoDados() {
  touch(); saveHist();
  const h = state.hist;
  const totalMs = h.sessoes.reduce((a, s) => a + (s.ultimo - s.inicio), 0);
  const linhas = [];
  TOPICS.forEach(tp => ["assoc", "mv", "caso"].forEach(g => {
    const js = h.jogos.filter(j => j.topic === tp.id && j.game === g);
    if (!js.length) { linhas.push({ tema: tp.title, jogo: GAME_LABELS[g], vezes: 0 }); return; }
    const melhor = js.reduce((a, j) => j.score / j.total > a.score / a.total ? j : a, js[0]);
    const ult = js[js.length - 1];
    linhas.push({ tema: tp.title, jogo: GAME_LABELS[g], vezes: js.length, melhor: melhor.score + "/" + melhor.total,
      ultimo: ult.score + "/" + ult.total, erros: g === "assoc" ? js.reduce((a, j) => a + (j.errors || 0), 0) : null,
      tempo: js.reduce((a, j) => a + j.dur, 0) });
  }));
  return { h, totalMs, linhas, jogados: linhas.filter(l => l.vezes).length };
}
function gerarResumo() {
  const msg = document.getElementById("reportMsg");
  const lib = window.jspdf && window.jspdf.jsPDF;
  if (!lib) { msg.textContent = "Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo."; return; }
  const { h, totalMs, linhas, jogados } = resumoDados();
  const doc = new lib({ unit: "mm", format: "a4" });
  const W = 210, M = 16;
  let y = 20;
  const ink = [18, 48, 46], accent = [224, 82, 58], muted = [85, 115, 112];
  doc.setFillColor(...ink); doc.rect(0, 0, W, 6, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(...ink);
  doc.text(pdfTxt("Resumo de participação"), M, y); y += 7;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(...muted);
  doc.text(pdfTxt("Jogos de avaliação nutricional da criança e do adolescente"), M, y); y += 10;

  const campo = (rot, val) => { doc.setFont("helvetica", "bold"); doc.setTextColor(...ink); doc.text(pdfTxt(rot), M, y); doc.setFont("helvetica", "normal"); doc.text(pdfTxt(val), M + 52, y); y += 6; };
  doc.setFontSize(11);
  campo("Aluno(a):", state.name);
  campo("Gerado em:", fmtData(Date.now()));
  campo("Entrada desta sessão:", fmtData(state.loginAt));
  campo("Tempo nesta sessão:", fmtDur(Date.now() - state.loginAt));
  campo("Tempo total registrado:", fmtDur(totalMs) + " em " + h.sessoes.length + (h.sessoes.length === 1 ? " sessão" : " sessões"));
  campo("Jogos concluídos:", jogados + " de " + linhas.length + " (" + h.jogos.length + (h.jogos.length === 1 ? " partida" : " partidas") + " no total)");
  const t = totals();
  campo("Pontuação (melhores):", t.s + " de " + (t.t || 0) + " pontos");
  y += 4;

  const cols = [{ k: "tema", t: "Tema", w: 40 }, { k: "jogo", t: "Jogo", w: 36 }, { k: "vezes", t: "Vezes", w: 14 }, { k: "melhor", t: "Melhor", w: 18 }, { k: "ultimo", t: "Último", w: 18 }, { k: "erros", t: "Erros assoc.", w: 22 }, { k: "tempo", t: "Tempo", w: 30 }];
  const header = () => {
    doc.setFillColor(...ink); doc.rect(M, y - 4.5, W - 2 * M, 7, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(255, 255, 255);
    let x = M + 2; cols.forEach(c => { doc.text(pdfTxt(c.t), x, y); x += c.w; }); y += 6;
  };
  header();
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  let lastTema = "";
  linhas.forEach((l, i) => {
    if (y > 280) { doc.addPage(); y = 20; header(); doc.setFont("helvetica", "normal"); doc.setFontSize(9); }
    if (i % 2 === 0) { doc.setFillColor(243, 247, 246); doc.rect(M, y - 4.2, W - 2 * M, 6, "F"); }
    doc.setTextColor(...(l.vezes ? ink : muted));
    const vals = { tema: l.tema === lastTema ? "" : l.tema, jogo: l.jogo, vezes: String(l.vezes), melhor: l.melhor || "-", ultimo: l.ultimo || "-",
      erros: l.erros === null || l.erros === undefined ? "-" : String(l.erros), tempo: l.vezes ? fmtDur(l.tempo) : "-" };
    lastTema = l.tema;
    let x = M + 2; cols.forEach(c => { doc.text(pdfTxt(vals[c.k]), x, y, { maxWidth: c.w - 2 }); x += c.w; }); y += 6;
  });

  y += 6;
  if (y > 260) { doc.addPage(); y = 20; }
  doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(...ink);
  doc.text(pdfTxt("Histórico de partidas"), M, y); y += 7;
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  if (!h.jogos.length) { doc.setTextColor(...muted); doc.text(pdfTxt("Nenhuma partida concluída ainda."), M, y); y += 6; }
  h.jogos.slice().reverse().forEach(j => {
    if (y > 285) { doc.addPage(); y = 20; }
    const tp = TOPICS.find(x => x.id === j.topic);
    doc.setTextColor(...ink);
    const linha = fmtData(j.fim) + "  |  " + (tp ? tp.title : j.topic) + " - " + GAME_LABELS[j.game] + "  |  " + j.score + "/" + j.total +
      (j.game === "assoc" ? "  |  " + (j.errors || 0) + " tentativas erradas" : "") + "  |  " + fmtDur(j.dur);
    doc.text(pdfTxt(linha), M, y); y += 5;
  });

  const pages = doc.getNumberOfPages();
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p); doc.setFontSize(8); doc.setTextColor(...muted);
    doc.text(pdfTxt(state.name + " - página " + p + " de " + pages), M, 292);
    doc.setDrawColor(...accent); doc.setLineWidth(0.6); doc.line(M, 287, W - M, 287);
  }
  const arquivo = "resumo-participacao-" + state.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase() + ".pdf";
  try { doc.save(arquivo); msg.textContent = "PDF gerado: " + arquivo; }
  catch (e) { msg.textContent = "O navegador bloqueou o download. Abra a página fora desta janela e tente de novo."; }
}

function toolbar(tp, game) {

    <button class="tool back" type="button" data-nav="back" title="Voltar aos temas">${ICONS.back}<span>Voltar</span></button>

    </div>
  </nav>`;
}
function bindToolbar(tp) {
  app.querySelectorAll(".toolbar .tool").forEach(b => b.onclick = () => {
    const n = b.dataset.nav;
    if (n === "back") { state.flipped = tp.id; renderHub(); window.scrollTo(0, 0); }
    else startGame(tp.id, n);
  });
}
function statline(idx, total, score, extra) {
  return `<div class="gamehead">
    <div class="progress" aria-hidden="true"><span style="width:${Math.round(idx / total * 100)}%"></span></div>
    <div class="statline"><span>Rodada ${Math.min(idx + 1, total)} de ${total}</span><span>Acertos: ${score}${extra || ""}</span></div>
  </div>`;
}

function startGame(topicId, game) {
  const tp = TOPICS.find(t => t.id === topicId);
  state.gameStart = Date.now(); touch();
  window.scrollTo(0, 0);
  if (game === "assoc") return playAssoc(tp);
  if (game === "mv") return playMV(tp);
  return playCase(tp);
}

function playMV(tp) {
  const items = alternated(tp.mv);
  let i = 0, score = 0;
  const draw = () => {
    const [text, truth, why] = items[i];
    app.innerHTML = `${toolbar(tp, "mv")}<section class="panel" style="display:grid;gap:18px">
      ${statline(i, items.length, score)}
      <p class="question">${esc(text)}</p>
      <div class="mv">
        <button class="opt" type="button" data-v="0">Mito</button>
        <button class="opt" type="button" data-v="1">Verdade</button>
      </div>
      <div id="fb"></div>
    </section>`;
    bindToolbar(tp);
    app.querySelectorAll(".mv .opt").forEach(b => b.onclick = () => {
      const ok = (b.dataset.v === "1") === truth;
      if (ok) score++;
      app.querySelectorAll(".mv .opt").forEach(x => {
        x.disabled = true;
        if ((x.dataset.v === "1") === truth) x.classList.add("right");
        else if (x === b) x.classList.add("wrong");
      });
      const last = i === items.length - 1;
      document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}">
        <strong>${ok ? "Acertou!" : "Não foi dessa vez."} É ${truth ? "verdade" : "mito"}.</strong>
        <span>${esc(why)}</span>
        <div class="row" style="margin-top:6px"><button class="btn" id="next" type="button">${last ? "Ver resultado" : "Próxima"}</button></div>
      </div>`;
      const n = document.getElementById("next"); n.focus();
      n.onclick = () => { i++; if (i < items.length) draw(); else finish(tp, "mv", score, items.length); };
    });
  };
  draw();
}

function playCase(tp) {
  const items = shuffle(tp.caso);
  let i = 0, score = 0;
  const draw = () => {
    const [q, opts, right, why] = items[i];
    const order = shuffle(opts.map((o, k) => k));
    app.innerHTML = `${toolbar(tp, "caso")}<section class="panel" style="display:grid;gap:18px">
      ${statline(i, items.length, score)}
      <div class="case"><p class="question" style="font-size:18px">${esc(q)}</p></div>
      <div class="options">${order.map((k, j) => `<button class="opt" type="button" data-k="${k}"><span class="letter">${LETTERS[j]})</span> ${esc(opts[k])}</button>`).join("")}</div>
      <div id="fb"></div>
    </section>`;
    bindToolbar(tp);
    app.querySelectorAll(".options .opt").forEach(b => b.onclick = () => {
      const k = Number(b.dataset.k), ok = k === right;
      if (ok) score++;
      app.querySelectorAll(".options .opt").forEach(x => {
        x.disabled = true;
        if (Number(x.dataset.k) === right) x.classList.add("right");
        else if (x === b) x.classList.add("wrong");
      });
      const last = i === items.length - 1;
      document.getElementById("fb").innerHTML = `<div class="feedback ${ok ? "ok" : "no"}">
        <strong>${ok ? "Raciocínio correto!" : "Resposta certa: " + esc(opts[right])}</strong>
        <span>${esc(why)}</span>
        <div class="row" style="margin-top:6px"><button class="btn" id="next" type="button">${last ? "Ver resultado" : "Próximo caso"}</button></div>
      </div>`;
      const n = document.getElementById("next"); n.focus();
      n.onclick = () => { i++; if (i < items.length) draw(); else finish(tp, "caso", score, items.length); };
    });
  };
  draw();
}

function playAssoc(tp) {
  const pairs = tp.assoc.map((p, k) => ({ k, a: p[0], b: p[1] }));
  const left = shuffle(pairs), right = shuffle(pairs);
  let selected = null, matched = 0, score = 0, errors = 0;
  const missed = new Set();
  app.innerHTML = `${toolbar(tp, "assoc")}<section class="panel" style="display:grid;gap:18px">
    <div id="hd"></div>
    <p class="muted">Toque em um termo da esquerda e depois na descrição que combina com ele. Cada par certo de primeira vale 1 ponto.</p>
    <div class="match">
      <div class="col"><h3>Termo</h3>${left.map(p => `<button class="tile" type="button" data-side="a" data-k="${p.k}">${esc(p.a)}</button>`).join("")}</div>
      <div class="col"><h3>Descrição</h3>${right.map(p => `<button class="tile" type="button" data-side="b" data-k="${p.k}">${esc(p.b)}</button>`).join("")}</div>
    </div>
    <div id="fb"></div>
  </section>`;
  bindToolbar(tp);
  const hd = () => {
    document.getElementById("hd").innerHTML = statline(matched, pairs.length, score, ` · <span class="errcount">Tentativas erradas: ${errors}</span>`);
  };
  hd();
  app.querySelectorAll(".tile").forEach(t => t.onclick = () => {
    if (t.classList.contains("matched")) return;
    if (t.dataset.side === "a") {
      app.querySelectorAll('.tile[data-side="a"]').forEach(x => x.classList.remove("selected"));
      t.classList.add("selected"); selected = t; return;
    }
    if (!selected) { document.getElementById("fb").innerHTML = `<p class="muted">Escolha primeiro um termo na coluna da esquerda.</p>`; return; }
    const k = selected.dataset.k;
    if (t.dataset.k === k) {
      matched++;
      if (!missed.has(k)) score++;
      [selected, t].forEach(x => { x.classList.remove("selected"); x.classList.add("matched"); x.disabled = true; });
      t.innerHTML = `<span class="tag">✓</span>` + t.innerHTML;
      selected = null;
      document.getElementById("fb").innerHTML = "";
      hd();
      if (matched === pairs.length) setTimeout(() => finish(tp, "assoc", score, pairs.length, errors), 450);
    } else {
      errors++; missed.add(k);
      hd();
      t.classList.add("shake");
      setTimeout(() => t.classList.remove("shake"), 380);
      document.getElementById("fb").innerHTML = `<p style="color:var(--bad)">Esse par não combina. Tente outra descrição para “${esc(selected.textContent)}”.</p>`;
    }
  });
}

function finish(tp, game, score, total, errors) {
  saveResult(tp.id, game, score, total);
  const fim = Date.now();
  state.hist.jogos.push({ topic: tp.id, game, score, total, errors: errors || 0, inicio: state.gameStart, fim, dur: fim - state.gameStart });
  touch(); saveHist();
  const pct = score / total;
  const msg = pct === 1 ? "Gabaritou! Domínio completo do tema."
    : pct >= 0.7 ? "Muito bom. Revise só os itens que errou."
    : pct >= 0.4 ? "Bom começo. Vale reler este tema no material e tentar de novo."
    : "Este tema precisa de revisão. Releia o material e jogue novamente.";
  const best = state.results[tp.id + ":" + game];
  app.innerHTML = `${toolbar(tp, game)}<section class="panel result">
    <span class="crumb">${GAME_LABELS[game]}</span>
    <h2>${esc(state.name)}, seu resultado</h2>
    <div class="big">${score}<small> / ${total}</small></div>
    <p>${msg}</p>
    ${game === "assoc" ? `<p>Tentativas erradas: <strong>${errors}</strong></p>` : ""}
    <p class="muted">Melhor resultado neste jogo: ${best.score}/${best.total} · Tempo nesta partida: ${fmtDur(Date.now() - state.gameStart)}</p>
    <div class="row">
      <button class="btn" type="button" id="again">Jogar de novo</button>
    </div>
  </section>`;
  bindToolbar(tp);
  document.getElementById("again").onclick = () => startGame(tp.id, game);
  document.getElementById("again").focus();
}

renderStart();
</script>
